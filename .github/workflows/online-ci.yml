name: Online checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: release_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-online.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-online.txt
      - name: Local and cloud regression tests
        run: python -m unittest -v test_checklist test_online
      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://release_test:test-only-password@localhost:5432/release_test
        run: python -m unittest -v test_online
      - run: python test_http_integration.py
      - name: Check assembled shared board modules
        run: |
          python -c "from pathlib import Path; import checklist_tool as c; Path('/tmp/release-board.js').write_text(c.load_board_js())"
          node --check /tmp/release-board.js
      - run: node --check online/static/app.js
      - run: node --check pages/experience.js
      - name: Build and verify Pages personal edition
        run: |
          python scripts/build_pages.py
          git diff --exit-code -- docs
          node --test test_pages.cjs
      - name: Browser visibility regression
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/test_pages_render.cjs
          node scripts/test_workflows.cjs
          node scripts/test_checklist_layout.cjs
          node scripts/test_workspace.cjs
          pip install "Pillow>=11,<13"
          node scripts/test_visual.cjs
      - name: Upload visual comparison on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison
          path: artifacts/visual
      - name: Build production image
        run: docker build -t release-desk:test .
