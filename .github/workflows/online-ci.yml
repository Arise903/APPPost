name: Online checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: release_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-online.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-online.txt ruff==0.17.3
      - name: Lint
        run: ruff check .
      - name: Local and cloud regression tests
        run: python -m unittest -v test_checklist test_online test_migrations test_operations
      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://release_test:test-only-password@localhost:5432/release_test
        run: python -m unittest -v test_online test_operations
      - run: python test_http_integration.py
      - name: Check assembled shared board modules
        run: |
          python -c "from pathlib import Path; import checklist_tool as c; Path('/tmp/release-board.js').write_text(c.load_board_js())"
          node --check /tmp/release-board.js
      - run: node --check online/static/app.js
      - run: node --check pages/experience.js
      - name: Build and verify Pages personal edition
        run: |
          python scripts/build_pages.py
          git diff --exit-code -- docs
          node --test test_pages.cjs scripts/test_vault_core.cjs
      - name: Browser visibility regression
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/test_optimizations.cjs
          node scripts/test_required_modules.cjs
          node scripts/test_project_import.cjs
          node scripts/test_pages_render.cjs
          node scripts/test_workflows.cjs
          node scripts/test_checklist_layout.cjs
          node scripts/test_workspace.cjs
          node scripts/test_release_flow.cjs
          node scripts/test_github_sync.cjs
          node scripts/test_guide_gate.cjs
          node scripts/test_vault.cjs
          node scripts/test_dashboard_upgrade.cjs
          pip install "Pillow>=11,<13"
          node scripts/test_visual.cjs
      - name: Upload visual comparison on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison
          path: artifacts/visual
      - name: Build production image
        run: |
          docker build -t release-desk:test .
          docker run --rm release-desk:test python -c "import checklist_tool as c; from pathlib import Path; assert {'adjust', 'analysis_api', 'firebase', 'subscriptions', 'subscription_events', 'permissions'} <= {m['id'] for m in c.load_checklist_modules()}; assert c.parse_md(Path('online/default_checklist.md').read_text())['features']['hasAdjust']; assert '__OPTIONAL_MODULES__' not in c.load_board_js()"

  deploy:
    name: Publish verified Pages build
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed version and primary flows
        run: node scripts/test_live.cjs "${{ steps.deployment.outputs.page_url }}"
