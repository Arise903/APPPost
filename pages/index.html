<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Release Desk · Pages 个人版</title><link rel="stylesheet" href="app.css"><script defer src="data.js"></script><script defer src="permission_visibility.js"></script><script defer src="store.js"></script><script defer src="experience.js"></script><script defer src="dashboard.js"></script></head><body>
<div class="app-shell"><aside class="sidebar"><a class="brand" href="index.html"><span class="brand-mark">R</span><span>RELEASE<br>DESK</span></a><div class="sidebar-label">PAGES 个人版</div><a class="nav-link active" href="index.html">▦　我的项目</a><div class="sidebar-bottom"><span class="subtle small">无需登录 · 无需服务器</span></div></aside><main class="main"><header class="topbar"><strong>我的项目</strong><span class="private-badge">● 记录保存在当前浏览器</span></header><div class="workspace"><section class="page-heading"><div><span class="eyebrow muted">YOUR PERSONAL RELEASE WORKSPACE</span><h1>准备好下一次发布。</h1><p class="subtle">检查、配置、证据和归档，都在这份个人工作台。</p></div><button id="newProject" class="button primary">＋ 新建 / 导入项目</button></section><section class="backup-tools"><button id="workspaceBackup" class="button secondary">导出全部项目与草稿</button><label class="button secondary" style="margin:0">导入工作台备份<input id="workspaceImport" type="file" accept=".json" hidden></label><span id="backupReminder" role="status"></span></section><section class="metrics"><div><span>全部项目</span><strong id="projectCount">—</strong></div><div><span>已处理检查项</span><strong id="resolvedCount">—</strong></div><div><span>待检查项</span><strong id="pendingCount">—</strong></div><div class="metrics-note"><p>数据不会上传 GitHub。<br><small>换浏览器、清理网站数据前，请先导出备份。</small></p></div></section><div class="section-heading"><h2>项目清单 <span id="countLabel">0</span></h2><label class="search"><input id="search" type="search" placeholder="搜索项目" aria-label="搜索项目"></label></div><div class="project-grid" id="projectGrid"></div><footer class="dashboard-footer"><span>RELEASE DESK · PAGES</span><span>无云端同步，请定期导出</span></footer></div></main></div>
<dialog id="createDialog"><form id="createForm"><div class="dialog-heading"><h2>新建 / 导入项目</h2><button type="button" id="closeDialog" class="icon-button" aria-label="关闭">×</button></div><label>项目名称<input name="name" required maxlength="100"></label><label>导入记录（可选）<input name="file" type="file" accept=".md,.json"></label><p class="subtle small">不选文件使用初始模板。支持 Markdown 和完整项目 JSON；导入会新建项目，不覆盖已有记录。</p><p id="createError" class="form-error" role="alert"></p><button class="button primary full" type="submit">创建项目 →</button></form></dialog><div id="notice" class="notice" role="status" hidden></div></body></html>
