{% extends 'base.html' %}{% block page %}login{% endblock %}{% block content %}
<main class="auth-layout"><section class="auth-story"><a class="brand" href="/"><span class="brand-mark">R</span> RELEASE DESK</a><div class="story-content"><span class="eyebrow">从检查，到放心发布</span><h1>每一次上架，<br>都有迹可循。</h1><p>把清单、权限配置和发布记录放在同一个工作台。<br>进度随时接续，团队协作有据可查。</p><div class="story-pills"><span>私有项目</span><span>云端同步</span><span>版本回溯</span></div></div><span class="story-footer">A calmer way to ship.</span></section><section class="auth-form"><div class="auth-card"><span class="eyebrow muted">欢迎回来</span><h2>登录上架工作台</h2><p class="subtle">使用管理员为你配置或邀请的账号。</p><form id="loginForm"><label>邮箱<input name="email" type="email" autocomplete="username" placeholder="you@example.com" required maxlength="254"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><p class="form-error" id="formError" role="alert"></p><button class="button primary full" type="submit">登录工作台 <span>→</span></button></form><p class="auth-help">首次使用？请联系项目所有者获取邀请链接。<br>忘记密码可由部署管理员重置。</p></div></section></main>
